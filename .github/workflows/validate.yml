name: Validate calendar and build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: https://bongoponji.example
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/check-static.mjs
      - run: node scripts/test-worker.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
